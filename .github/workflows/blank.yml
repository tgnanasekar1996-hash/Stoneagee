name: Video Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Video Placeholder
        run: |
          mkdir -p output
          echo "Placeholder build step"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-video
          path: output/
